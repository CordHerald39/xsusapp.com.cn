<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
<title>XSUS品牌纸雕插画</title>
<desc>互相穿行的两条纸带，以立体交叠形成 X。 原创可编辑矢量图，无外部素材。</desc>
<defs>
  <linearGradient id="xsus-paper" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#f7f9f8"/><stop offset="1" stop-color="#e5ebe7"/></linearGradient>
  <linearGradient id="xsus-accent" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#a19fc6"/><stop offset="1" stop-color="#47438f"/></linearGradient>
  <linearGradient id="xsus-accentSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9e8f2"/><stop offset=".5" stop-color="#d1d0e3"/><stop offset="1" stop-color="#9f9dc5"/></linearGradient>
  <linearGradient id="xsus-leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#abb79a"/><stop offset="1" stop-color="#5f785b"/></linearGradient>
  <linearGradient id="xsus-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536058"/><stop offset=".6" stop-color="#303c35"/><stop offset="1" stop-color="#19231d"/></linearGradient>
  <filter id="xsus-shadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#35443c" flood-opacity=".12"/></filter>
  <filter id="xsus-smallshadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#35443c" flood-opacity=".1"/></filter>
  <filter id="xsus-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="800" height="600" fill="#fff"/>
<ellipse cx="406" cy="535" rx="223" ry="18" fill="#273933" opacity=".075" filter="url(#xsus-blur)"/>
